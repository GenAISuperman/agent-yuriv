apiVersion: apps/v1
kind: Deployment
metadata:
  name: "yuriv"
  namespace: "agents-team"
  labels:
    app: "yuriv"
    team: "team"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: "yuriv"
  template:
    metadata:
      labels:
        app: "yuriv"
        team: "team"
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: "sa-yuriv"
      containers:
        - name: "yuriv"
          image: "acragenticdemopoc.azurecr.io/agents/yuriv:latest"
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: "config-yuriv"
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
